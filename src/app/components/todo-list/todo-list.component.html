<div class="d-flex flex-column gap-3 mb-3">
   <button class="btn btn-outline-primary w-100" (click)="todoService.isAddItem = true" >Add Task</button>
  <input type="text" class="form-control"  placeholder="Search Task" [(ngModel)]="todoService.searchText" (change)="todoService.updateList()">
</div>
<ul class="list-group">
   @for (item of todoService._filterdList; track item.id) {
      <li
        class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 border border-danger"
        [todoItem]="item"
        app-todo-list-item
        (delete)="todoService.onDelete($event)"
      ></li>
   } @empty {
      <p class="text-center fs-1">No Tasks 🥴</p>
   }
</ul>
